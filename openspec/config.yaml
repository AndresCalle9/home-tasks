schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Producto: "Home Tasks" - app web para repartir las tareas del hogar entre los
  integrantes de una sola familia (no multi-tenant, no hay concepto de cuentas
  separadas por hogar).

  Funciones principales:
  1. Asignación de tareas por periodo (disparada manualmente, NO automática/cron):
     un integrante presiona un botón "Asignar tareas", define el periodo (fecha
     inicio/fin) y ANTES de ejecutar el sorteo puede revisar/editar, para ese
     periodo puntual, qué tareas son "fijas" (y de quién) y cuáles quedan como
     "variables" (esto parte de un valor por defecto por tarea, pero es editable
     periodo a periodo). Reglas de negocio del sorteo:
     - Tareas "fijas" (para ese periodo): siempre las hace la misma persona. Estas
       tareas NO entran al sorteo aleatorio y no cuentan en el balance de carga
       del resto de tareas.
     - Tareas "variables": se reparten en cada periodo de forma aleatoria pero
       ponderada por edad (adultos asumen más carga que niños/adolescentes) y
       buscando balancear la carga acumulada en el tiempo (quien recibió menos
       carga en periodos anteriores tiene más probabilidad de recibir tareas).
     - Cada tarea variable recibe una única persona asignada para TODO el periodo
       (ej. quien cocina el desayuno lo hace todos los días de ese periodo; no hay
       rotación día a día dentro del mismo periodo).
     - Las tareas "de una vez por periodo" (barrer, trapear, ruta del popo,
       organizar zonas comunes, etc., en contraste con tareas diarias como
       cocinar) también reciben, como parte del sorteo, un día específico dentro
       del periodo para poder ubicarlas en el calendario.
     - El algoritmo de asignación vive en la capa de API de Next.js (no hay
       backend aparte). Debe ser determinista dado un seed para poder testearlo.
  2. Calendario semanal: vista de lunes a domingo mostrando, por día, qué tarea le
     corresponde a quién, a partir del resultado de la asignación del periodo
     vigente. Debe ser clara y visual (pensada para mostrarse en un
     refrigerador/tablet o revisarse desde el celular).
  3. Gestión (CRUD): pantalla para crear, editar y eliminar integrantes (nombre,
     edad) y tareas (nombre, si es diaria, si es fija por defecto y de quién,
     peso/dificultad opcional).

  Modelo de dominio (un solo hogar, sin autenticación por cuentas; ver
  supabase/schema.sql para el detalle):
  - members: integrantes del hogar (nombre, edad).
  - tasks: catálogo de tareas del hogar (nombre, si es diaria, si es fija por
    defecto y de quién, peso/dificultad opcional).
  - periods: cada ciclo de asignación definido manualmente (fecha inicio/fin,
    estado draft/assigned).
  - period_task_settings: snapshot editable por periodo de qué tareas son fijas
    y de quién (lo que se revisa/edita antes de correr el sorteo).
  - assignments: asignación resultante de una tarea a un integrante en un
    periodo (y día, para tareas de una vez por periodo). Histórico, usado
    también para el balance acumulado.
  No hay login: se entra directo a la app y cada integrante simplemente elige su
  perfil (como un selector de perfil estilo Netflix), sin contraseñas.

  Seguridad: nunca hardcodear secretos/keys en el código; toda credencial vive
  en variables de entorno server-side. La Supabase service role key (server-side
  únicamente) nunca se expone al cliente ni se marca como NEXT_PUBLIC_. RLS
  habilitado en todas las tablas; el cliente nunca habla directo con Supabase,
  siempre a través de la capa de API de Next.js.

  Stack técnico:
  - Next.js (App Router) desplegado en Vercel.
  - Sin backend dedicado: toda la lógica (sorteo, balance, consultas) vive en la
    capa de API de Next.js (route handlers / server actions), no en el cliente.
  - Supabase como base de datos (Postgres), acceso vía API routes / server
    actions usando las credenciales en `.env` (no exponer la key de servicio al
    cliente si en algún momento se agrega).
  - Package manager: npm.
  - Idioma de la interfaz: español. Código, nombres de variables/funciones,
    comentarios y commits: en inglés (convención de desarrollo estándar).
  - Al implementar o revisar componentes de React/Next.js, seguir el skill
    `vercel-react-best-practices` (patrones de rendimiento de Vercel Engineering).

  Fuera de alcance por ahora: multi-hogar, autenticación con contraseña,
  notificaciones push, apps móviles nativas.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Mantener el proposal enfocado en una sola función (sorteo o calendario), no mezclar ambas en un mismo change salvo que el usuario lo pida explícitamente.
  design:
    - Especificar siempre el esquema de tablas de Supabase involucradas (nombre, columnas clave, relaciones) cuando el change toque el modelo de datos, y si requiere cambios a supabase/schema.sql.
    - Detallar el algoritmo de sorteo/balance en pseudocódigo cuando el change lo modifique, incluyendo cómo se pondera edad y carga acumulada.
    - Confirmar explícitamente que ninguna credencial (service role key u otra) queda expuesta al cliente cuando el change toque acceso a Supabase.
  tasks:
    - Incluir un paso explícito de verificación con el skill `vercel-react-best-practices` para cualquier tarea que cree o modifique componentes/páginas de Next.js.
    - Separar tareas de "capa de datos/API" de tareas de "UI" cuando ambas estén presentes.
