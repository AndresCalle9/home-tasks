schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Producto: "Nest" - app web multi-tenant para repartir las tareas del
  hogar entre los integrantes de una familia. Cualquier persona puede crear
  su propia cuenta/hogar (Supabase Auth, correo + contraseña); cada hogar
  ve y opera solo sobre sus propios datos. Sigue sin haber cuentas por
  integrante dentro de un hogar: un solo login por hogar, y adentro cada
  integrante elige su perfil (selector estilo Netflix), sin contraseñas
  para eso.

  Notas históricas:
  - Una versión anterior giraba en torno a "periodos" (fecha inicio/fin,
    tareas fijas/variables, ponderación por edad, balance histórico entre
    periodos). La reescritura "app v2" reemplazó ese modelo por el descrito
    abajo: solo existe "la semana vigente", sin periodos ni historial.
  - Hasta el change `multi-tenant-households`, la app era de un solo hogar
    sin cuentas. Cambios propuestos a partir de ahora deben partir del
    modelo multi-tenant descrito abajo, no del anterior.

  Funciones principales:
  1. Reparto de la semana vigente (disparado manualmente desde "Ajustes" con
     el botón "Repartir nuestra semana", NO automático/cron, protegido por
     la clave de acciones **del hogar que la dispara** — hasheada en
     `household.action_password_hash`, ya no una variable de entorno
     compartida por todo el despliegue): el sorteo reemplaza por completo
     las filas de `assignments` de ese hogar — no hay concepto de periodo
     ni historial de semanas pasadas. Reglas de negocio del sorteo:
     - Para cada día de la semana y cada tarea activa que aplique ese día, se
       elige al azar entre los integrantes elegibles para esa tarea
       (`task_eligible_members`) al que tenga menor carga acumulada en lo que
       va de esa misma corrida (ponderada por el `effort` de la tarea:
       ligera/media/alta), rompiendo empates al azar vía un seed. No hay
       distinción entre tareas fijas/variables ni ponderación por edad (los
       integrantes no tienen edad en el modelo actual).
     - `task_conflicts` marca pares de tareas que nunca deben caer el mismo
       día en el mismo integrante; se respeta durante el sorteo.
     - Cada tarea recibe una única persona asignada para todos los días en
       que aplica esa semana (ej. quien cocina el desayuno lo hace todos los
       días que le tocan; no hay rotación día a día).
     - La frecuencia de cada tarea (`diario` / `dias` específicos / `semanal`)
       es una propiedad fija de la tarea, configurada en Ajustes — no se
       redefine por corrida.
     - El algoritmo de asignación vive en la capa de API de Next.js (no hay
       backend aparte, ver `lib/algorithm/schedule.ts`). Debe ser
       determinista dado un seed para poder testearlo.
     - "Reiniciar semana" (misma clave) vuelve a marcar todo como pendiente
       sin re-sortear quién hace qué.
  2. Calendario semanal (pestaña "Semana"): vista de lunes a domingo, con
     modo por día y por persona, mostrando qué tarea le corresponde a quién a
     partir de la tabla `assignments` vigente. Cada asignación tiene un
     checkbox de completado (sin restricción de quién lo marca, sin clave).
     Desde la ficha de una tarea también se puede reasignar el responsable
     (con clave) o retar a un intercambio ("duelo", sin clave, resuelto con
     piedra/papel/tijera entre los dos integrantes involucrados).
  3. Gestión (CRUD): pestaña "Equipo" para crear/editar/eliminar integrantes
     (nombre, color) y marcar para qué tareas es elegible cada uno; pestaña
     "Ajustes" para crear/editar/activar/eliminar tareas (nombre, icono,
     esfuerzo, frecuencia y días, integrantes elegibles) y el nombre del
     hogar.

  Modelo de dominio (multi-tenant por household_id; ver supabase/schema.sql
  para el detalle de columnas y policies de RLS):
  - household: un hogar/cuenta — id (uuid), user_id (1:1 con auth.users),
    name, action_password_hash (hasheada).
  - members: integrantes de un hogar (household_id, nombre, color). Sin edad.
  - tasks: catálogo de tareas de un hogar (household_id, nombre, icono,
    esfuerzo, frecuencia, días, activa/inactiva). Nombre único por hogar,
    no globalmente.
  - task_eligible_members: qué integrantes de un hogar pueden recibir cada
    tarea en el sorteo (carga household_id directamente).
  - task_conflicts: pares de tareas de un hogar que nunca deben caer el
    mismo día en el mismo integrante (carga household_id directamente).
  - assignments: la semana vigente de un hogar — una fila por (tarea, día)
    con el integrante responsable y su estado
    (pending/completed/sin-responsable). No hay historial: repartir la
    semana reemplaza las filas de ese hogar.

  Seguridad: nunca hardcodear secretos/keys en el código; toda credencial vive
  en variables de entorno server-side. La Supabase service role key es solo
  para scripts de mantenimiento a mano (nunca en el camino de una request);
  la app usa el anon key, siempre server-side (Server Actions/middleware),
  nunca en un componente "use client" ni con prefijo NEXT_PUBLIC_. RLS
  habilitado en todas las tablas **con policies reales basadas en
  auth.uid()** — es la barrera de aislamiento multi-tenant, no un
  formalismo; el cliente nunca habla directo con Supabase, siempre a través
  de la capa de Next.js.

  Stack técnico:
  - Next.js (App Router) desplegado en Vercel.
  - Sin backend dedicado: toda la lógica (sorteo, balance, consultas) vive en la
    capa de API de Next.js (route handlers / server actions), no en el cliente.
  - Supabase como base de datos (Postgres), acceso vía API routes / server
    actions usando las credenciales en `.env` (no exponer la key de servicio al
    cliente si en algún momento se agrega).
  - Package manager: npm.
  - Idioma de la interfaz: español. Código, nombres de variables/funciones,
    comentarios y commits: en inglés (convención de desarrollo estándar).
  - Al implementar o revisar componentes de React/Next.js, seguir el skill
    `vercel-react-best-practices` (patrones de rendimiento de Vercel Engineering).

  Fuera de alcance por ahora: múltiples cuentas/perfiles con permisos
  distintos dentro de un mismo hogar, invitar a otra persona a un hogar
  existente, planes de pago, notificaciones push, apps móviles nativas.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Mantener el proposal enfocado en una sola función (sorteo o calendario), no mezclar ambas en un mismo change salvo que el usuario lo pida explícitamente.
  design:
    - Especificar siempre el esquema de tablas de Supabase involucradas (nombre, columnas clave, relaciones) cuando el change toque el modelo de datos, y si requiere cambios a supabase/schema.sql.
    - Detallar el algoritmo de sorteo/balance en pseudocódigo cuando el change lo modifique, incluyendo cómo se pondera la carga acumulada (el modelo actual no tiene edad ni tareas fijas/variables).
    - Confirmar explícitamente que ninguna credencial (service role key u otra) queda expuesta al cliente cuando el change toque acceso a Supabase.
  tasks:
    - Incluir un paso explícito de verificación con el skill `vercel-react-best-practices` para cualquier tarea que cree o modifique componentes/páginas de Next.js.
    - Separar tareas de "capa de datos/API" de tareas de "UI" cuando ambas estén presentes.
